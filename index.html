<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chess</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%2314110e'/%3E%3Cpath d='M16 5.5v3.2M13.4 7.2h5.2' stroke='%23d4b483' stroke-width='1.6' stroke-linecap='round'/%3E%3Cpath d='M9.5 26.5h13v-3.2c0-1.2 2.2-3.4 1.2-6.2-1.6-4.2-5.4-2.4-6.6 1.2-.4-1.6-1.2-3.4-1.6-3.4s-1.2 1.8-1.6 3.4c-1.2-3.6-5-5.4-6.6-1.2-1 2.8 1.2 5 1.2 6.2v3.2z' fill='%23f3efe6'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Outfit:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <main class="app">
      <header class="top">
        <div>
          <p class="eyebrow" id="eyebrow">You play White</p>
          <h1>Chess</h1>
        </div>
        <button id="new-game" type="button">New game</button>
      </header>
      <p id="status" class="status" role="status" aria-live="polite">White to move</p>
      <div class="stage">
        <div class="frame">
          <div class="board-wrap">
            <div id="board" class="board" role="grid" aria-label="Chessboard"></div>
            <div id="promo" class="promo" role="dialog" aria-label="Choose promotion piece" hidden></div>
          </div>
        </div>
        <aside class="panel">
          <div class="modes" role="group" aria-label="Who plays Black">
            <button id="mode-computer" class="mode is-on" type="button" aria-pressed="true">Vs computer</button>
            <button id="mode-hotseat" class="mode" type="button" aria-pressed="false">Two players</button>
          </div>
          <section>
            <h2>Captured</h2>
            <div class="captures">
              <p>White took <span id="cap-w"></span></p>
              <p>Black took <span id="cap-b"></span></p>
            </div>
          </section>
          <section>
            <h2>Score sheet</h2>
            <ol id="moves" class="moves"></ol>
          </section>
          <p id="hint" class="hint"></p>
        </aside>
      </div>
    </main>
    <p id="toast" class="toast" role="alert" hidden></p>
    <script type="module" src="js/ui.js"></script>
  </body>
</html>
